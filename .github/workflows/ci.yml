name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  typescript:
    name: core, server, desktop UI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Kiểm tra định dạng
        run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test @wakeup/core (gồm ca chuẩn QC-01), server, desktop
        run: pnpm test
      - name: Build giao diện desktop
        run: pnpm --filter @wakeup/desktop build
      - name: Build bundle server
        run: pnpm --filter @wakeup/server build

  migrations:
    name: migration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wakeup
          POSTGRES_PASSWORD: wakeup
          POSTGRES_DB: wakeup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wakeup" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Chạy up, down rồi up lại
        env:
          DATABASE_URL: postgres://wakeup:wakeup@localhost:5432/wakeup?sslmode=disable
        run: |
          curl -fsSL -o dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          chmod +x dbmate
          ./dbmate -d apps/server/db/migrations --no-dump-schema up
          ./dbmate -d apps/server/db/migrations --no-dump-schema rollback
          ./dbmate -d apps/server/db/migrations --no-dump-schema up

  server-image:
    name: build image server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t wakeup-server:ci .

  desktop:
    name: desktop Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS phát hành ở 1.1 nhưng build ngay từ bây giờ để không lệch.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Sinh icon nếu repo chưa có
        if: hashFiles('apps/desktop/src-tauri/icons/icon.ico') == ''
        working-directory: apps/desktop
        run: pnpm tauri icon app-icon.svg
      - name: Build bộ cài (chưa ký)
        working-directory: apps/desktop
        run: pnpm tauri build
