[package]
name = "wakeup-desktop"
version = "0.1.0"
description = "App desktop của Wakeup"
edition = "2021"
publish = false

[lib]
# Tên riêng cho lib để không trùng với binary trên Windows.
name = "wakeup_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
